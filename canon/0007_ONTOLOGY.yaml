# ── Retired predicates ────────────────────────────────────────────────────
# Must stay exactly equal to engine.validator.RETIRED_PREDICATES.
# Rationale + retirement dates live in canon/0006 ## Retired Predicates.
retired_predicates:
  - archived_to
  - co_occurs_with
  - regressed_against
  - triggered_reflex

# ── Disjointness axioms ───────────────────────────────────────────────────
# INTENTIONALLY EMPTY. Declaring two families or types mutually exclusive is a
# governance decision for the Founder, not an engineering one — it makes every node
# holding both labels a standing violation. The machinery (`are_disjoint`,
# `disjoint_sets`, ONT_DISJOINT_VIOLATION) ships and is tested against a fixture
# ontology in engine/tests/test_ontology.py, so asserting an axiom later is a
# one-line edit to this key with no code change.
disjoint: []
