# Arcturion Brain — Machine-Readable Ontology
#
# The single source of truth for the Brain's vocabulary and its axioms.
# `engine/ontology.py` loads it; `engine/validator.py`'s PREDICATE_CANON and
# RETIRED_PREDICATES must stay exactly equal to it — parity is test-enforced
# (`engine/tests/test_ontology.py`), not derived; the type reasoner and
# transitive-closure traversal engine read the axioms through the same loader.
#
# Editing rules
#   - `predicates` must stay exactly equal to engine.validator.PREDICATE_CANON.
#     engine/tests/test_ontology.py asserts this; a divergence is a test failure.
#   - `inverse` must be symmetric (A.inverse=B implies B.inverse=A). Enforced at load.
#   - Every node_type.family must appear in `families`. Enforced at load.
#   - Assert `transitive`/`functional`/`disjoint` ONLY where canon/0006 is unambiguous
#     AND the live graph shows zero violations. An unconstrained predicate is correct;
#     a wrong axiom produces false inferences downstream.
#   - Endpoint typing (domain/range) is NOT this file's layer. See the `predicates` note.
version: 1
generated_from:
  - canon/0005_NODE_TAXONOMY.md
  - canon/0006_RELATIONSHIP_TAXONOMY.md
  - engine/validator.py
  - index/brain.sqlite   # live type/family distribution + constraint verification (read-only)

# ── Families ──────────────────────────────────────────────────────────────
# Families include documented and previously observed types. Including data, contact,
# and project lets Metric/Asset/Contact/Project map to their intended families.
families:
  - agent
  - application
  - automation
  - capability
  - code
  - concept
  - contact
  - data
  - document
  - event
  - external
  - project

# ── Node types ────────────────────────────────────────────────────────────
# Every type in canon/0005, plus every type present in the live graph. Types that
# exist in the graph but not in canon/0005 carry `undocumented: true` so enforcement
# stays non-breaking while the drift stays visible to `python3 -m engine.ontology --audit`.
#
# Deliberately EXCLUDED as invalid (surfaced as defects by --audit):
#   - the two unsubstituted template placeholder strings
#     `<agent|founder|company|...>` and `<Pillar|Decision|Fact|...>`
#   - the lowercase case-variant twins of documented types: `decision`, `event`,
#     `capability`, `concept`, `skill`. A closed vocabulary must not contain
#     both `Decision` and `decision`.
node_types:
  Agent:          {family: agent}
  Application:    {family: application}
  Asset:          {family: data}
  Automation:     {family: automation}
  Bookmark:       {family: external}
  Capability:     {family: capability}
  Channel:        {family: external}
  Concept:        {family: document}
  Config:         {family: code}
  Constraint:     {family: document}
  Contact:        {family: contact}
  Decision:       {family: document}
  Edit:           {family: event}
  Endpoint:       {family: application}
  Entity:         {family: concept}
  Event:          {family: event}
  Fact:           {family: document}
  Handoff:        {family: event}
  Hypothesis:     {family: document}
  Metric:         {family: data}
  Module:         {family: code}
  Pattern:        {family: document}
  Pillar:         {family: document}
  Playbook:       {family: document}
  Policy:         {family: document}
  Preference:     {family: document}
  Project:        {family: project}
  Question:       {family: document}
  Reflection:     {family: document}
  Script:         {family: code}
  Service:        {family: application}
  Session:        {family: event}
  Skill:          {family: application}
  Source:         {family: document}
  Task:           {family: event}
  Workspace:      {family: agent}
  # --- observed types absent from canon/0005 ---
  Approval_gate:  {family: event, undocumented: true}
  CLI_Tool:       {family: application, undocumented: true}
  Company:        {family: document, undocumented: true}
  Founder:        {family: document, undocumented: true}
  Reminder:       {family: event, undocumented: true}
  System:         {family: document, undocumented: true}
  commandment:    {family: document, undocumented: true}

# ── Predicates ────────────────────────────────────────────────────────────
# Exactly the 82 predicates in engine.validator.PREDICATE_CANON.
# Grouping mirrors that literal so the two stay diffable.
#
# transitive: asserted only on the four structural containment/ownership predicates.
#   canon/0006 describes no other predicate as transitive, and a false transitive claim
#   makes the closure engine emit edges that were never asserted.
# functional: no axioms are asserted. The is_functional() API and
#   ONT_FUNCTIONAL_VIOLATION check remain available for explicitly defined axioms.
# domain/range: DELIBERATELY EMPTY HERE. Endpoint typing is NOT this file's layer —
#   `engine/validator.py` -> DOMAIN_RANGE + SAME_FAMILY_PREDICATES is the authority, and
#   canon/0006 ## Domain / Range documents it. That layer types on `nodes.family` and is
#   derived from edges whose endpoints resolve. Duplicating it here would
#   create two contradicting tables. The domain_of()/range_of() API stays (it returns an
#   empty frozenset = unconstrained) so a future axiom needs no code change.
predicates:
  # Evidence
  supports:
    transitive: false
    functional: false
  contradicts:
    transitive: false
    functional: false
  derived_from:
    inverse: source_of
    transitive: false
    functional: false
  cites:
    inverse: cited_by
    transitive: false
    functional: false
  measured_by:
    transitive: false
    functional: false
  evidenced_by:
    transitive: false
    functional: false
  source_of:
    inverse: derived_from
    transitive: false
    functional: false
  cited_by:
    inverse: cites
    transitive: false
    functional: false
  # Reasoning
  depends_on:
