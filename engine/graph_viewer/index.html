<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>🧠 Arcturion Infinite Brain — Graph Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root[data-theme="dark"] {
    --bg: #0b0e14;
    --panel: #131722;
    --border: #2a2e3a;
    --text: #d1d4dc;
    --muted: #787b86;
    --accent: #f7931a;
    --link-bg: #0b0e14;
    --code-bg: #1a1f2e;
    --shadow: rgba(0,0,0,0.6);
    --doc: #5d9cec;
    --code: #ac92ec;
    --automation: #48cfad;
    --application: #ffce54;
    --agent: #fc6e51;
    --event: #ed5565;
    --external: #a0d468;
    --concept: #ec87c0;
  }
  :root[data-theme="light"] {
    --bg: #f7f7f7;
    --panel: #ffffff;
    --border: #d8dde6;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #d97706;
    --link-bg: #f3f4f6;
    --code-bg: #f3f4f6;
    --shadow: rgba(0,0,0,0.12);
    --doc: #2563eb;
    --code: #7c3aed;
    --automation: #10b981;
    --application: #d97706;
    --agent: #dc2626;
    --event: #db2777;
    --external: #65a30d;
    --concept: #c026d3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  aside { width: 300px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
  main { flex: 1; position: relative; }
  #graph { position: absolute; inset: 0; }
  #status { position: absolute; top: 10px; right: 10px; background: var(--panel); padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; color: var(--muted); box-shadow: 0 2px 6px var(--shadow); }
  #toolbar { position: absolute; top: 10px; right: 200px; display: flex; gap: 6px; }
  #toolbar button { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; box-shadow: 0 2px 6px var(--shadow); }
  #toolbar button:hover { border-color: var(--accent); }
  #context-panel {
    position: absolute; top: 10px; left: 10px; width: 440px; max-height: 85vh;
    background: var(--panel); padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 4px; overflow-y: auto; display: none; box-shadow: 0 4px 14px var(--shadow);
  }
  #context-panel.open { display: block; }
  #context-panel h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
  #context-panel h4 { margin: 12px 0 4px; font-size: 12px; color: var(--accent); }
  #context-panel #panel-body { font-size: 12px; line-height: 1.5; max-height: 65vh; overflow-y: auto; }
  #context-panel #panel-body a { color: var(--accent); text-decoration: none; cursor: pointer; }
  #context-panel #panel-body a:hover { text-decoration: underline; }
  #context-panel #panel-body code { background: var(--code-bg); padding: 1px 4px; border-radius: 2px; font-size: 11px; }
  #context-panel #panel-body pre { background: var(--code-bg); padding: 8px; border-radius: 3px; overflow-x: auto; font-size: 11px; }
  #context-panel #panel-body p { margin: 6px 0; }
  #context-panel #panel-body ul { margin: 4px 0 6px 18px; padding: 0; }
  aside h2 { font-size: 14px; margin: 0 0 8px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
  aside h3 { font-size: 12px; margin: 14px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  aside label { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12px; }
  aside input[type="checkbox"] { accent-color: var(--accent); }
  aside input[type="number"], aside input[type="text"] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 4px 6px; border-radius: 3px; font: 12px monospace; }
  aside button { width: 100%; background: var(--accent); color: #000; border: none; padding: 8px; border-radius: 3px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  aside button.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  .badge { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .stat { font-size: 11px; color: var(--muted); margin: 2px 0; }
  .close { float: right; cursor: pointer; color: var(--muted); }
  .theme-toggle { background: transparent; border: none; cursor: pointer; font-size: 16px; padding: 0; color: var(--accent); }

  /* Command palette */
  #palette-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 100; }
  #palette-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding-top: 14vh; }
  #palette { width: 560px; max-width: 90vw; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 30px var(--shadow); overflow: hidden; }
  #palette-input { width: 100%; background: var(--bg); color: var(--text); border: none; border-bottom: 1px solid var(--border); padding: 12px 14px; font: 14px -apple-system, sans-serif; outline: none; }
  #palette-results { max-height: 50vh; overflow-y: auto; }
  .palette-item { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .palette-item.active { background: var(--code-bg); }
  .palette-item:hover { background: var(--code-bg); }
  .palette-item small { color: var(--muted); margin-left: auto; }
  .palette-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h2>
      <span>🧠 Brain Viewer</span>
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme">🌗</button>
    </h2>

    <h3>Node families</h3>
    <div id="family-filters"></div>

    <h3>Edge predicate families</h3>
    <div id="predicate-filters"></div>

    <h3>Centrality threshold</h3>
    <label>Min × 1000: <input id="min-cent" type="number" value="0" min="0" step="1" /></label>

    <h3>Limit</h3>
    <label>Max nodes: <input id="limit" type="number" value="500" min="50" max="5000" step="50" /></label>

    <h3>Search</h3>
    <input id="search" type="text" placeholder="title contains…" />

    <button id="reload">🔄 Reload</button>
    <button id="reset-view" class="secondary">🎯 Center view</button>
    <button id="fit-all" class="secondary">🔍 Fit all</button>
    <button id="freeze-layout" class="secondary">❄️ Freeze layout</button>
    <button id="screenshot" class="secondary">📸 Screenshot PNG</button>
    <button id="reset-filters" class="secondary">↺ Reset filters</button>

    <h3>Stats</h3>
    <div id="stats">Loading…</div>

    <h3>Legend (node)</h3>
    <div class="stat"><span class="badge" style="background: var(--doc)"></span>document</div>
    <div class="stat"><span class="badge" style="background: var(--code)"></span>code</div>
    <div class="stat"><span class="badge" style="background: var(--automation)"></span>automation</div>
    <div class="stat"><span class="badge" style="background: var(--application)"></span>application</div>
    <div class="stat"><span class="badge" style="background: var(--agent)"></span>agent</div>
    <div class="stat"><span class="badge" style="background: var(--event)"></span>event</div>
    <div class="stat"><span class="badge" style="background: var(--external)"></span>external</div>
    <div class="stat"><span class="badge" style="background: var(--concept)"></span>concept</div>

    <h3>Tips</h3>
    <div class="stat">⌘K — search & jump</div>
    <div class="stat">click node — context pack</div>
    <div class="stat">link inside pack — recenter</div>
  </aside>
  <main>
    <div id="graph"></div>
    <div id="toolbar"></div>
    <div id="status">idle</div>
    <div id="context-panel">
      <span class="close" id="close-panel">✕</span>
      <h3 id="panel-title">Node</h3>
      <div id="panel-body"></div>
    </div>
  </main>
</div>

<!-- Command palette overlay -->
<div id="palette-overlay">
  <div id="palette">
    <input id="palette-input" type="text" placeholder="Fuzzy search loaded nodes — Enter to jump · Esc to close" />
    <div id="palette-results"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/force-graph@1.52.0/dist/force-graph.min.js" integrity="sha384-isW4dF8tfo3t+I2iiIdnz1MFV+hW1Vn3YyY2PmAgPbRQaW7Biahepz8fTRR+nLxm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.3/lib/marked.umd.js" integrity="sha384-tp/syYhgK+FeVVrz2SPmgKX5atVZ8P8hReAvOPUn58M265VNy1IbdmZAY7Jmd0gF" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<script src="/viewer/viewer.js"></script>
</body>
</html>
