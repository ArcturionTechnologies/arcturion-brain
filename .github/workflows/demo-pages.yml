name: Public Brain demo
on:
  push:
    branches: [main]
    paths: ["demo/**", "tests/public_demo.test.cjs", ".github/workflows/demo-pages.yml"]
  pull_request:
    paths: ["demo/**", "tests/public_demo.test.cjs", ".github/workflows/demo-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Check the invented demo and publication boundary
        run: node --test tests/public_demo.test.cjs
      - name: Check browser script syntax
        run: |
          node --check demo/data.js
          node --check demo/model.js
          node --check demo/app.js

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: demo

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the static exhibit
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
