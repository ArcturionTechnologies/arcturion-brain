name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the core YAML dependency
        run: |
          python -m pip install --only-binary=:all: -r requirements-core.txt
      - name: Check source syntax
        run: python -m compileall -q engine brain_http_main.py guarded_proof.py
      - name: Exercise the actual engine with invented records
        run: |
          env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
            HOME="$PWD/.proof-ci/home" \
            ARCTURION_BRAIN_WORK_ROOT="$PWD/.proof-ci" \
            ARCTURION_BRAIN_TEST_YAML=1 \
            python guarded_proof.py
